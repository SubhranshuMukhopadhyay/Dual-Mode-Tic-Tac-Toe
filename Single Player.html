<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player vs Computer Tic Tac Toe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link rel="stylesheet" href="./CSS Files/Single Player.css">
</head>
<body class="gamepagebody">
    <header class="gamepageheader">
        <ul class="gamepageheaderul">
            <li><div><button class="headerbuttons backtohomebutton"><i class="fa-solid fa-house"></i></button></div></li>
            <li><h1>Player vs Computer</h1></li>
            <li><div><button class="headerbuttons multiplayermodebutton"><i class="fa-solid fa-users"></i></button></div></li>
        </ul>
    </header>
    <main>
        <div class="gameboard">
            <button class="gamebutton" id="gamebutton1"></button>
            <button class="gamebutton" id="gamebutton2"></button>
            <button class="gamebutton" id="gamebutton3"></button>
            <button class="gamebutton" id="gamebutton4"></button>
            <button class="gamebutton" id="gamebutton5"></button>
            <button class="gamebutton" id="gamebutton6"></button>
            <button class="gamebutton" id="gamebutton7"></button>
            <button class="gamebutton" id="gamebutton8"></button>
            <button class="gamebutton" id="gamebutton9"></button>
        </div>
    </main>
    <footer class="gamepagefooter">
        <ul class="gamepagefooterul">
            <li>
                <ul class="scoreboardul">
                   <li class="playernamelabel">Player X :</li>
                   <li><input class="scoreboard" id="playerxscore" type="number" value="00" readonly></li>
                   <li class="playernamelabel">Player O :</li>
                   <li><input class="scoreboard" id="player0score" type="number" value="00" readonly></li> 
                </ul>
            </li>
            <li><input class="gamestatus" type="text" readonly></li>
            <li><div><button class="newgamebutton"><i class="fa-solid fa-arrow-rotate-left"></i></button></div></li>
        </ul>
    </footer>
</body>
<script>var exports = {};</script>
<script src="./TypeScript Files/JavaScript Files/Single Player.js"></script>
</html>
