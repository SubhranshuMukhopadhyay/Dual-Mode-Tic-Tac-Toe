<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link rel="stylesheet" href="./src/output.css">
    <title>Tic Tac Toe</title>
</head>
<body class="bg-[url('Images/Homepage.gif')] bg-cover bg-center">
    <h1 class="lg:text-[15rem] md:text-[10rem] text-[5rem] text-center text-[red] font-bold font-['Times_New_Roman',serif] [text_shadow:10px_0px_5px_red] lg:mb-30 md:mb-60 mb-25">
        Tic Tac Toe
    </h1>
    <div>
        <ul class="md:flex md:flex-row md:gap-x-55 justify-center items-center text-center">
            <li>
                <button class="entrybuttontosingleplayer h-30 lg:w-120 md:w-80 w-70 text-[#fffafa] lg:text-[3rem] md:text-[2rem] text-[2.5rem] font-bold border-5 border-red-500 bg-tranparent rounded-4xl backdrop-blur-[10px] [-webkit-text-stroke:3px_red]  transition-all duration-300 ease-in-out animate-bounce hover:cursor-pointer hover:bg-[#fffafa] hover:border-3 hover:border-solid hover:border-sky-400 hover:text-red-500 hover:lg:text-[3.5rem] hover:md:text-[2.5rem] hover:text-[3rem]">
                Single Player</button>
            </li>
            <li>
                <button class="entrybuttontomultiplayer h-30 lg:w-120 md:w-80 w-70 text-[#fffafa] lg:text-[3rem] md:text-[2rem] text-[2.5rem] font-bold border-5 border-red-500 bg-tranparent rounded-4xl backdrop-blur-[10px] [-webkit-text-stroke:3px_red]  transition-all duration-300 ease-in-out animate-bounce hover:cursor-pointer hover:bg-[#fffafa] hover:border-3 hover:border-solid hover:border-sky-400 hover:text-red-500 hover:lg:text-[3.5rem] hover:md:text-[2.5rem] hover:text-[3rem]">
                Multi Player</button>
            </li>
        </ul>
    </div>
</body>

</html>
